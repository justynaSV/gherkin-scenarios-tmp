name: Validate Gherkin Features

on:
  pull_request:
    paths:
      - 'features/**/*.feature'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**/*.js'
      - 'features/~step_definitions/**/*.js'
      - 'features/~support/**/*.js'
      - 'cucumber.js'
      - 'docs/traceability.md'
      - '.github/workflows/validate-features.yml'
  push:
    branches:
      - main
    paths:
      - 'features/**/*.feature'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**/*.js'
      - 'features/~step_definitions/**/*.js'
      - 'features/~support/**/*.js'
      - 'cucumber.js'
      - 'docs/traceability.md'
      - '.github/workflows/validate-features.yml'

jobs:
  validate-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate feature files
        run: npm run validate
